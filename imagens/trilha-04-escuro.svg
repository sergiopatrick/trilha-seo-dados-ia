<text x="168.0" y="140.0" font-size="18" font-weight="400" fill="#c3c2b7" text-anchor="start">7 módulos · 30 h</text>
<text x="44.0" y="184.0" font-size="21" font-weight="400" fill="#f0efec" text-anchor="start">GEO (Generative Engine Optimization) é o trabalho de ser encontrado, entendido e</text>
<text x="44.0" y="212.3" font-size="21" font-weight="400" fill="#f0efec" text-anchor="start">citado por sistemas que respondem com texto gerado.</text>
