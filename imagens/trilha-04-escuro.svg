<text x="120.0" y="646.7" font-size="16" font-weight="400" fill="#c3c2b7" text-anchor="start">Claude-User</text>
<text x="120.0" y="668.7" font-size="16" font-weight="400" fill="#c3c2b7" text-anchor="start">PerplexityBot e Perplexity-User</text>
