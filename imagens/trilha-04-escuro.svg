<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1229" width="1000" height="1229" role="img" aria-label="Trilha 04, GEO e busca generativa. Visão geral dos módulos." font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Trilha 04, GEO e busca generativa. Visão geral dos módulos.</title>
