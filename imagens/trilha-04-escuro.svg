<text x="120.0" y="966.7" font-size="21" font-weight="700" fill="#f0efec" text-anchor="start">Pesquisa acadêmica sobre</text>
<text x="120.0" y="994.7" font-size="21" font-weight="700" fill="#f0efec" text-anchor="start">GEO</text>
<text x="120.0" y="1026.7" font-size="16" font-weight="400" fill="#c3c2b7" text-anchor="start">O artigo GEO de Aggarwal e colegas e o</text>
