<text x="120.0" y="302.7" font-size="21" font-weight="700" fill="#f0efec" text-anchor="start">Como buscadores com IA</text>
<text x="120.0" y="330.7" font-size="21" font-weight="700" fill="#f0efec" text-anchor="start">recuperam e citam</text>
<text x="120.0" y="362.7" font-size="16" font-weight="400" fill="#c3c2b7" text-anchor="start">Recuperação, ranqueamento de trechos e</text>
<text x="120.0" y="384.7" font-size="16" font-weight="400" fill="#c3c2b7" text-anchor="start">geração</text>
<text x="120.0" y="406.7" font-size="16" font-weight="400" fill="#c3c2b7" text-anchor="start">Query fan-out</text>
<text x="120.0" y="428.7" font-size="16" font-weight="400" fill="#c3c2b7" text-anchor="start">Grounding</text>
