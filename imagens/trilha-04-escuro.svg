<text x="588.0" y="302.7" font-size="21" font-weight="700" fill="#f0efec" text-anchor="start">AI Overviews e AI Mode do</text>
<text x="588.0" y="330.7" font-size="21" font-weight="700" fill="#f0efec" text-anchor="start">Google</text>
<text x="588.0" y="362.7" font-size="16" font-weight="400" fill="#c3c2b7" text-anchor="start">Quando o AI Overview aparece</text>
