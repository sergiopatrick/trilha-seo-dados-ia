<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1407" width="1000" height="1407" role="img" aria-label="Trilha 02, SEO técnico. Visão geral dos módulos." font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Trilha 02, SEO técnico. Visão geral dos módulos.</title>
<defs><marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b6a66"/></marker></defs>
<rect width="100%" height="100%" rx="16" fill="#fcfcfb"/>
<rect x="44.0" y="44.0" width="96.0" height="96.0" rx="14" fill="#1c5cab"/>
<text x="92.0" y="108.0" font-size="44" font-weight="700" fill="#ffffff" text-anchor="middle">02</text>
<text x="168.0" y="66.0" font-size="15" font-weight="600" fill="#52514e" text-anchor="start" letter-spacing="1.5">TRILHA 02 · BUSCA</text>
<text x="168.0" y="110.0" font-size="40" font-weight="700" fill="#0b0b0b" text-anchor="start">SEO técnico</text>
<text x="168.0" y="140.0" font-size="18" font-weight="400" fill="#52514e" text-anchor="start">10 módulos · 60 h</text>
<text x="44.0" y="184.0" font-size="21" font-weight="400" fill="#0b0b0b" text-anchor="start">SEO técnico é garantir que buscadores e robôs de IA consigam encontrar, baixar,</text>
<text x="44.0" y="212.3" font-size="21" font-weight="400" fill="#0b0b0b" text-anchor="start">renderizar, entender e indexar as páginas certas, rápido.</text>
<rect x="44.0" y="256.7" width="444.0" height="236.0" rx="12" fill="#f3f2ef"/>
<circle cx="84.0" cy="296.7" r="20" fill="#1c5cab"/>
<text x="84.0" y="303.7" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="120.0" y="302.7" font-size="21" font-weight="700" fill="#0b0b0b" text-anchor="start">Rastreio, renderização e</text>
<text x="120.0" y="330.7" font-size="21" font-weight="700" fill="#0b0b0b" text-anchor="start">indexação</text>
<text x="120.0" y="362.7" font-size="16" font-weight="400" fill="#52514e" text-anchor="start">Descoberta, rastreio, renderização e</text>
<text x="120.0" y="384.7" font-size="16" font-weight="400" fill="#52514e" text-anchor="start">indexação</text>
<text x="120.0" y="406.7" font-size="16" font-weight="400" fill="#52514e" text-anchor="start">Relatório de indexação de páginas e os</text>
<text x="120.0" y="428.7" font-size="16" font-weight="400" fill="#52514e" text-anchor="start">motivos de exclusão</text>
<text x="120.0" y="450.7" font-size="16" font-weight="400" fill="#52514e" text-anchor="start">Ferramenta de inspeção de URL</text>
<rect x="512.0" y="256.7" width="444.0" height="236.0" rx="12" fill="#f3f2ef"/>
<circle cx="552.0" cy="296.7" r="20" fill="#1c5cab"/>
<text x="552.0" y="303.7" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="588.0" y="302.7" font-size="21" font-weight="700" fill="#0b0b0b" text-anchor="start">robots.txt, meta robots e</text>
<text x="588.0" y="330.7" font-size="21" font-weight="700" fill="#0b0b0b" text-anchor="start">sitemaps</text>
<text x="588.0" y="362.7" font-size="16" font-weight="400" fill="#52514e" text-anchor="start">Sintaxe do robots.txt e precedência de</text>
<text x="588.0" y="384.7" font-size="16" font-weight="400" fill="#52514e" text-anchor="start">regras</text>
<text x="588.0" y="406.7" font-size="16" font-weight="400" fill="#52514e" text-anchor="start">Por que Disallow não tira página do</text>
<text x="588.0" y="428.7" font-size="16" font-weight="400" fill="#52514e" text-anchor="start">índice</text>
<text x="588.0" y="450.7" font-size="16" font-weight="400" fill="#52514e" text-anchor="start">noindex, nofollow, noarchive,</text>
<text x="588.0" y="472.7" font-size="16" font-weight="400" fill="#52514e" text-anchor="start">max-snippet</text>
<rect x="44.0" y="512.7" width="444.0" height="198.0" rx="12" fill="#f3f2ef"/>
<circle cx="84.0" cy="552.7" r="20" fill="#1c5cab"/>
<text x="84.0" y="559.7" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="120.0" y="558.7" font-size="21" font-weight="700" fill="#0b0b0b" text-anchor="start">Canonical, duplicação,</text>
<text x="120.0" y="586.7" font-size="21" font-weight="700" fill="#0b0b0b" text-anchor="start">parâmetros e paginação</text>
<text x="120.0" y="618.7" font-size="16" font-weight="400" fill="#52514e" text-anchor="start">rel=canonical e canonical escolhida pelo</text>
<text x="120.0" y="640.7" font-size="16" font-weight="400" fill="#52514e" text-anchor="start">Google</text>
<text x="120.0" y="662.7" font-size="16" font-weight="400" fill="#52514e" text-anchor="start">Parâmetros de rastreamento e de filtro</text>
<text x="120.0" y="684.7" font-size="16" font-weight="400" fill="#52514e" text-anchor="start">Paginação sem rel=next</text>
<rect x="512.0" y="512.7" width="444.0" height="198.0" rx="12" fill="#f3f2ef"/>
<circle cx="552.0" cy="552.7" r="20" fill="#1c5cab"/>
<text x="552.0" y="559.7" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
<text x="588.0" y="558.7" font-size="21" font-weight="700" fill="#0b0b0b" text-anchor="start">Status HTTP,</text>
<text x="588.0" y="586.7" font-size="21" font-weight="700" fill="#0b0b0b" text-anchor="start">redirecionamentos e</text>
<text x="588.0" y="614.7" font-size="21" font-weight="700" fill="#0b0b0b" text-anchor="start">migração de site</text>
<text x="588.0" y="646.7" font-size="16" font-weight="400" fill="#52514e" text-anchor="start">301 e 308 contra 302 e 307</text>
<text x="588.0" y="668.7" font-size="16" font-weight="400" fill="#52514e" text-anchor="start">Cadeias e laços</text>
<text x="588.0" y="690.7" font-size="16" font-weight="400" fill="#52514e" text-anchor="start">Soft 404</text>
<rect x="44.0" y="730.7" width="444.0" height="186.0" rx="12" fill="#f3f2ef"/>
<circle cx="84.0" cy="770.7" r="20" fill="#1c5cab"/>
<text x="84.0" y="777.7" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
<text x="120.0" y="776.7" font-size="21" font-weight="700" fill="#0b0b0b" text-anchor="start">JavaScript SEO</text>
<text x="120.0" y="808.7" font-size="16" font-weight="400" fill="#52514e" text-anchor="start">Renderização no servidor, no cliente,</text>
<text x="120.0" y="830.7" font-size="16" font-weight="400" fill="#52514e" text-anchor="start">estática e híbrida</text>
<text x="120.0" y="852.7" font-size="16" font-weight="400" fill="#52514e" text-anchor="start">Hidratação</text>
<text x="120.0" y="874.7" font-size="16" font-weight="400" fill="#52514e" text-anchor="start">Links que são &lt;a href&gt; e links que são</text>
<text x="120.0" y="896.7" font-size="16" font-weight="400" fill="#52514e" text-anchor="start">onclick</text>
<rect x="512.0" y="730.7" width="444.0" height="186.0" rx="12" fill="#f3f2ef"/>
<circle cx="552.0" cy="770.7" r="20" fill="#1c5cab"/>
<text x="552.0" y="777.7" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">6</text>
<text x="588.0" y="776.7" font-size="21" font-weight="700" fill="#0b0b0b" text-anchor="start">Core Web Vitals</text>
<text x="588.0" y="808.7" font-size="16" font-weight="400" fill="#52514e" text-anchor="start">Dado de campo contra dado de laboratório</text>
<text x="588.0" y="830.7" font-size="16" font-weight="400" fill="#52514e" text-anchor="start">Percentil 75</text>
<text x="588.0" y="852.7" font-size="16" font-weight="400" fill="#52514e" text-anchor="start">Limites de bom</text>
<rect x="44.0" y="936.7" width="444.0" height="170.0" rx="12" fill="#f3f2ef"/>
<circle cx="84.0" cy="976.7" r="20" fill="#1c5cab"/>
<text x="84.0" y="983.7" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">7</text>
<text x="120.0" y="982.7" font-size="21" font-weight="700" fill="#0b0b0b" text-anchor="start">Dados estruturados</text>
<text x="120.0" y="1014.7" font-size="16" font-weight="400" fill="#52514e" text-anchor="start">JSON-LD, microdados e RDFa</text>
<text x="120.0" y="1036.7" font-size="16" font-weight="400" fill="#52514e" text-anchor="start">Tipos com resultado enriquecido vigente</text>
<text x="120.0" y="1058.7" font-size="16" font-weight="400" fill="#52514e" text-anchor="start">@id e grafo de entidades</text>
<rect x="512.0" y="936.7" width="444.0" height="170.0" rx="12" fill="#f3f2ef"/>
<circle cx="552.0" cy="976.7" r="20" fill="#1c5cab"/>
<text x="552.0" y="983.7" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">8</text>
<text x="588.0" y="982.7" font-size="21" font-weight="700" fill="#0b0b0b" text-anchor="start">Logs de servidor e</text>
<text x="588.0" y="1010.7" font-size="21" font-weight="700" fill="#0b0b0b" text-anchor="start">ferramentas de crawl</text>
<text x="588.0" y="1042.7" font-size="16" font-weight="400" fill="#52514e" text-anchor="start">Formato de log de acesso</text>
<text x="588.0" y="1064.7" font-size="16" font-weight="400" fill="#52514e" text-anchor="start">Frequência de rastreio por seção</text>
<text x="588.0" y="1086.7" font-size="16" font-weight="400" fill="#52514e" text-anchor="start">Screaming Frog e crawlers em Python</text>
<rect x="44.0" y="1126.7" width="444.0" height="208.0" rx="12" fill="#f3f2ef"/>
<circle cx="84.0" cy="1166.7" r="20" fill="#1c5cab"/>
<text x="84.0" y="1173.7" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">9</text>
<text x="120.0" y="1172.7" font-size="21" font-weight="700" fill="#0b0b0b" text-anchor="start">Sites internacionais</text>
<text x="120.0" y="1204.7" font-size="16" font-weight="400" fill="#52514e" text-anchor="start">Códigos de idioma e região</text>
<text x="120.0" y="1226.7" font-size="16" font-weight="400" fill="#52514e" text-anchor="start">Reciprocidade</text>
<text x="120.0" y="1248.7" font-size="16" font-weight="400" fill="#52514e" text-anchor="start">x-default</text>
<rect x="512.0" y="1126.7" width="444.0" height="208.0" rx="12" fill="#f3f2ef"/>
<circle cx="552.0" cy="1166.7" r="20" fill="#1c5cab"/>
<text x="552.0" y="1173.7" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">10</text>
<text x="588.0" y="1172.7" font-size="21" font-weight="700" fill="#0b0b0b" text-anchor="start">SEO em CMS</text>
<text x="588.0" y="1204.7" font-size="16" font-weight="400" fill="#52514e" text-anchor="start">WordPress, temas, plugins de SEO, WP-CLI</text>
<text x="588.0" y="1226.7" font-size="16" font-weight="400" fill="#52514e" text-anchor="start">e REST API</text>
<text x="588.0" y="1248.7" font-size="16" font-weight="400" fill="#52514e" text-anchor="start">Elementor e a diferença entre código e</text>
<text x="588.0" y="1270.7" font-size="16" font-weight="400" fill="#52514e" text-anchor="start">conteúdo</text>
<text x="588.0" y="1292.7" font-size="16" font-weight="400" fill="#52514e" text-anchor="start">Shopify, Liquid, apps, robots.txt.liquid</text>
<text x="588.0" y="1314.7" font-size="16" font-weight="400" fill="#52514e" text-anchor="start">e limites de URL</text>
<text x="44.0" y="1376.7" font-size="15" font-weight="400" fill="#6b6a66" text-anchor="start">trilha-seo-dados-ia · roteiro, aulas, vídeos, leituras e exercícios</text>
</svg>
